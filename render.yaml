services:
  - type: web
    name: all-games-into-tg-bot
    runtime: node
    plan: free
    autoDeploy: true
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    # ВАЖНО: на бесплатном тарифе Render persistent disk недоступен — он стирает
    # файлы при «засыпании»/редеплое. Код поддерживает DATA_DIR (см. src/db.js).
    # Для сохранения данных — платный тариф: раскомментируйте блок ниже.
    # disk:
    #   name: data
    #   mountPath: /data
    #   sizeGB: 1
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        value: "8542930176"
      - key: BOT_USERNAME
        value: "@AllGamesIntoTG"
      # - key: DATA_DIR
      #   value: /data